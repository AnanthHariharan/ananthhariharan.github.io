<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photographs — Ananth Hariharan</title>
  <meta name="description" content="A photo journal by Ananth Hariharan." />
  <link rel="shortcut icon" href="../assets/images/monogram.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <header class="masthead">
    <a href="../index.html" class="back-link" aria-label="Back to portfolio">← Ananth Hariharan</a>
    <h1 class="wordmark">Photographs</h1>
    <nav class="modes" id="modes" aria-label="View modes">
      <button class="mode-btn" data-mode="albums">Albums</button>
      <button class="mode-btn" data-mode="collections">Collections</button>
      <button class="mode-btn" data-mode="map">Map</button>
    </nav>
  </header>

  <main id="app"></main>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox-close" aria-label="Close">&times;</button>
    <div class="lightbox-inner">
      <figure class="lightbox-figure">
        <img id="lightbox-img" alt="" />
      </figure>
      <aside class="lightbox-meta">
        <h2 id="meta-title" class="meta-h">Untitled</h2>
        <p id="meta-description" class="meta-desc"></p>
        <div id="meta-tags" class="meta-tags"></div>
        <dl class="meta-info">
          <dt>Album</dt><dd id="meta-album">—</dd>
          <dt>File</dt><dd id="meta-file">—</dd>
          <dt>Taken</dt><dd id="meta-taken">—</dd>
          <dt>Location</dt><dd id="meta-location">—</dd>
        </dl>
      </aside>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
